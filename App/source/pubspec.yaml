name: lr2021_app
description: LR2021 Node – Steuerung, Meshtastic-Chat, MeshCore, eigener 70-cm-Funk.
publish_to: 'none'
version: 1.6.6+12

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  path_provider: ^2.1.4
  flutter_libserialport: ^0.6.0
  usb_serial: ^0.5.2
  sensors_plus: ^6.1.0
  crypto: ^3.0.3
  file_picker: ^8.1.2
  image: ^4.2.0
  open_filex: ^4.5.0
  archive: ^3.6.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
