#!/usr/sbin/nft -f
# LR2021 Node – Firewall
# Bewusst KEIN „flush ruleset“: NetworkManager legt für Hotspot/USB-Netz (ipv4.method=shared)
# eigene Tabellen (nm-shared-*) mit NAT an – die dürfen nicht gelöscht werden.
# Nur die eigene Tabelle wird ersetzt:
table inet lr2021
delete table inet lr2021

table inet lr2021 {
	set tcp_offen {
		type inet_service; flags interval
		elements = {
			22,           # SSH
			53,           # DNS (Hotspot/USB)
			80,           # Weboberfläche
			443,          # reserviert
			1883,         # MQTT (reserviert)
			2021-2023,    # ESP32 A, ESP32 B, GPS
			2024-2030,    # reserviert für spätere Funktionen
			4403          # Meshtastic-TCP-API (reserviert)
		}
	}
	set udp_offen {
		type inet_service; flags interval
		elements = {
			53,           # DNS
			67-68,        # DHCP
			123,          # NTP
			4403,         # reserviert
			5353          # mDNS (Avahi, lr2021-xxxx.local)
		}
	}

	chain input {
		type filter hook input priority filter; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		meta l4proto icmp accept
		meta l4proto ipv6-icmp accept
		tcp dport @tcp_offen accept
		udp dport @udp_offen accept
		udp dport 546 accept    # DHCPv6-Client (Heim-WLAN mit IPv6)
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iifname { "wlan0", "usb0" } accept   # Clients von Hotspot/USB dürfen nach außen (NAT macht NetworkManager)
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
